name: RetroBar

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    name: Build
    strategy:
      matrix:
        publishprofile: [ [x64, net6.0-windows], [x86, net6.0-windows], [x64, net10.0-windows], [x86, net10.0-windows], [ARM64, net10.0-windows], [x64-portable, net6.0-windows], [x86-portable, net6.0-windows], [x64-portable, net10.0-windows], [x86-portable, net10.0-windows], [ARM64-portable, net10.0-windows] ]
    runs-on: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install nbgv
      uses: dotnet/nbgv@v0.5.2

    - name: Publish app
      run: dotnet publish -p:PublishProfile=$env:Profile -f $env:Framework -p:DebugType=None -p:DebugSymbols=false -p:PublishDir=bin\Release\$env:Framework\publish-$env:Profile
      env:
        Profile: ${{ matrix.publishprofile[0] }}
        Framework: ${{ matrix.publishprofile[1] }}

    - name: Record exact build provenance
      shell: pwsh
      env:
        Profile: ${{ matrix.publishprofile[0] }}
        Framework: ${{ matrix.publishprofile[1] }}
        SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        $sourceHead = $env:SOURCE_HEAD
        $sourceTree = (git rev-parse ($sourceHead + '^{tree}')).Trim()
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $testedCommit = (git rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $testedTree = (git rev-parse 'HEAD^{tree}').Trim()
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $manifest = [ordered]@{
          source_head = $sourceHead
          source_tree = $sourceTree
          tested_commit = $testedCommit
          tested_tree = $testedTree
          workflow_run = $env:GITHUB_RUN_ID
          workflow_attempt = $env:GITHUB_RUN_ATTEMPT
        }
        $destination = "RetroBar/bin/Release/$env:Framework/publish-$env:Profile/source-provenance.json"
        $manifest | ConvertTo-Json | Set-Content -LiteralPath $destination -Encoding utf8
        Write-Host "Published source $sourceHead tree $sourceTree; CI checkout $testedCommit tree $testedTree"

    - name: Copy license
      run: cp DistLicense.txt RetroBar\bin\Release\${{ matrix.publishprofile[1] }}\publish-${{ matrix.publishprofile[0] }}\License.txt

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: RetroBar ${{ matrix.publishprofile[0] == 'x86' && '32-bit' || matrix.publishprofile[0] == 'x64' && '64-bit' || matrix.publishprofile[0] == 'ARM64' && 'ARM64' || matrix.publishprofile[0] == 'x86-portable' && 'Portable 32-bit' || matrix.publishprofile[0] == 'x64-portable' && 'Portable 64-bit' || 'Portable ARM64' }}${{ matrix.publishprofile[1] == 'net6.0-windows' && ' Win7-8' || '' }}
        path: RetroBar\bin\Release\${{ matrix.publishprofile[1] }}\publish-${{ matrix.publishprofile[0] }}\

  installer:
    name: Installer
    needs: [ build ]
    runs-on: windows-2025

    env:
      installer: installer.iss

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download build artifacts - ARM64
      uses: actions/download-artifact@v8
      with:
        name: RetroBar ARM64
        path: RetroBar\bin\Release\net10.0-windows\publish-ARM64\

    - name: Download build artifacts - x64
      uses: actions/download-artifact@v8
      with:
        name: RetroBar 64-bit
        path: RetroBar\bin\Release\net10.0-windows\publish-x64\

    - name: Download build artifacts - x86
      uses: actions/download-artifact@v8
      with:
        name: RetroBar 32-bit
        path: RetroBar\bin\Release\net10.0-windows\publish-x86\

    - name: Download build artifacts - x64 Win7-8
      uses: actions/download-artifact@v8
      with:
        name: RetroBar 64-bit Win7-8
        path: RetroBar\bin\Release\net6.0-windows\publish-x64\

    - name: Download build artifacts - x86 Win7-8
      uses: actions/download-artifact@v8
      with:
        name: RetroBar 32-bit Win7-8
        path: RetroBar\bin\Release\net6.0-windows\publish-x86\

    - name: Compile Inno Setup installer
      run: ISCC.exe "${{ env.installer }}"

    - name: Upload installer
      uses: actions/upload-artifact@v7
      with:
        name: RetroBar Installer
        path: bin\RetroBarInstaller.exe
        
  zip-portable:
    name: ZIP Portable
    needs: [ build ]
    runs-on: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download build artifacts - ARM64
      uses: actions/download-artifact@v8
      with:
        name: RetroBar Portable ARM64
        path: RetroBar\portable\ARM64

    - name: Download build artifacts - x64
      uses: actions/download-artifact@v8
      with:
        name: RetroBar Portable 64-bit
        path: RetroBar\portable\64-bit

    - name: Download build artifacts - x86
      uses: actions/download-artifact@v8
      with:
        name: RetroBar Portable 32-bit
        path: RetroBar\portable\32-bit

    - name: Download build artifacts - x64 Win7-8
      uses: actions/download-artifact@v8
      with:
        name: RetroBar Portable 64-bit Win7-8
        path: RetroBar\portable\Win7-8\64-bit

    - name: Download build artifacts - x86 Win7-8
      uses: actions/download-artifact@v8
      with:
        name: RetroBar Portable 32-bit Win7-8
        path: RetroBar\portable\Win7-8\32-bit

    - name: Upload ZIP
      uses: actions/upload-artifact@v7
      with:
        name: RetroBar Portable
        path: RetroBar\portable\
  evaluation-portable:
    name: Isolated evaluation x64 (no shell launch)
    needs: [ build ]
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download x64 portable build
        uses: actions/download-artifact@v8
        with:
          name: RetroBar Portable 64-bit
          path: RetroBar\isolated-evaluation\

      - name: Mark evaluator and include its safety launcher
        shell: pwsh
        run: |
          $target = "RetroBar/isolated-evaluation"
          if (!(Test-Path "$target/RetroBar.exe")) { throw "Expected x64 portable executable is missing" }
          if (!(Test-Path "$target/source-provenance.json")) { throw "Missing build provenance" }
          $provenance = Get-Content "$target/source-provenance.json" -Raw | ConvertFrom-Json
          $actualTree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $provenance.tested_commit -ne $env:GITHUB_SHA -or $provenance.tested_tree -ne $actualTree -or $provenance.workflow_run -ne $env:GITHUB_RUN_ID -or $provenance.workflow_attempt -ne $env:GITHUB_RUN_ATTEMPT) {
            throw "Evaluator payload and workflow checkout provenance disagree"
          }
          (Get-FileHash -Algorithm SHA256 "$target/RetroBar.exe").Hash.ToLowerInvariant() | Set-Content "$target/RetroBar.exe.sha256" -Encoding utf8
          Copy-Item tools/evaluation/RUN-ISOLATED-EVALUATION.cmd "$target/RUN-ISOLATED-EVALUATION.cmd"
          Copy-Item tools/evaluation/README.md "$target/README-EVALUATION.md"
          Set-Content -LiteralPath "$target/RetroBar-Evaluation.marker" -Value "RetroBar isolated evaluator" -Encoding utf8
          foreach ($needed in @("RetroBar.exe", "RetroBar-Evaluation.marker", "RUN-ISOLATED-EVALUATION.cmd", "README-EVALUATION.md", "source-provenance.json", "RetroBar.exe.sha256")) {
            if (!(Test-Path "$target/$needed")) { throw "Evaluation package missing $needed" }
          }

      - name: Upload isolated evaluation candidate
        uses: actions/upload-artifact@v7
        with:
          name: RetroBar Isolated Evaluation 64-bit
          path: RetroBar/isolated-evaluation/
